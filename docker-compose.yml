
networks:
  candles_net:
    driver: bridge

services:
  Candles:
    build: ./Candles
    image: candles
    container_name: candles_web
    command: python app.py
    volumes:
      - ./Candles:/app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - candles_net
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: candles_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: candles_db
      POSTGRES_USER: candles_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candles_user -d candles_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - candles_net
  

  rustfs:
    image: rustfs/rustfs:latest
    container_name: candles_rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - candles_net
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:9000/ >/dev/null || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s



volumes:
  postgres_data:
  rustfs_data:
